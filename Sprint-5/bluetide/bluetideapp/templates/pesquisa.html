{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de praias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/pesquisa.css' %}">
</head>

<body>
    <div class="app">

        <nav class="sidemenu" aria-label="Menu principal">
            <div class="sidemenu-topo">
                <a href="{% url 'mapa_web' %}" class="sidemenu-marca">BlueTide</a>
                <button type="button" class="botao-fechar" onclick="fecharMenu()" aria-label="Fechar menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round">
                        <path d="M6 6l12 12M18 6L6 18" />
                    </svg>
                </button>
            </div>
            <ul class="sidemenu-lista">
                <li>
                    <a href="{% url 'mapa_web' %}" class="sidemenu-link">
                        <img src="{% static 'imagens/icone-local.png' %}" alt="">
                        Mapa
                    </a>
                </li>
                <li>
                    <a href="{% url 'pesquisa' %}" class="sidemenu-link ativo" aria-current="page">
                        <img src="{% static 'imagens/icone-busca.png' %}" alt="">
                        Pesquisa
                    </a>
                </li>
                <li>
                    <a href="{% url 'favoritos' %}" class="sidemenu-link">
                        <img src="{% static 'imagens/icone-favoritos.png' %}" alt="">
                        Favoritos
                    </a>
                </li>
                <li>
                    <a href="{% url 'perfil' %}" class="sidemenu-link">
                        <img src="{% static 'imagens/icone-usuario.png' %}" alt="">
                        Perfil
                    </a>
                </li>
            </ul>
        </nav>

        <div class="fundo-escuro" onclick="fecharMenu()"></div>

        <main class="conteudo">

            <header class="topo-celular">
                <button type="button" class="botao-topo" onclick="abrirMenu()" aria-label="Abrir menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round">
                        <path d="M4 7h16M4 12h16M4 17h16" />
                    </svg>
                </button>
                <span class="sidemenu-marca">BlueTide</span>
            </header>

            <div class="page">
                <h1>Pesquisa</h1>

                <div class="barra-busca">
                    <label class="busca">
                        <img src="{% static 'imagens/icone-busca.png' %}" alt="">
                        <input id="busca" type="search" placeholder="Praia, posto ou bairro" autocomplete="off">
                    </label>
                    <a href="filtro-toggle.html" class="botao-topo" aria-label="Filtros">
                        <img src="{% static 'imagens/icone-filtros.png' %}" alt="">
                    </a>
                </div>

                <p id="contador" class="contador"></p>

                <div id="lista" class="lista"></div>
            </div>
        </main>
    </div>

    <script>
        function abrirMenu() {
            document.body.classList.add("menu-aberto");
        }

        function fecharMenu() {
            document.body.classList.remove("menu-aberto");
        }

        const praias = [
            { nome: "Botafogo", local: "Enseada", cidade: "Rio de Janeiro", estado: "RJ", bairro: "Botafogo", condicao: "Impropria", nota: 8.5, distancia: 1.1, andando: "7 min", lotacao: "10%", imagem: "img/copacabana.jpg", ondas: 0.2 },
            { nome: "Copacabana", local: "Posto 5", cidade: "Rio de Janeiro", estado: "RJ", bairro: "Copacabana", condicao: "Atencao", nota: 4.2, distancia: 3.5, andando: "5 min", lotacao: "50%", imagem: "img/copacabana.jpg", ondas: 0.5 },
            { nome: "Copacabana", local: "Posto 4", cidade: "Rio de Janeiro", estado: "RJ", bairro: "Copacabana", condicao: "Propria", nota: 9.1, distancia: 0.5, andando: "4 min", lotacao: "90%", imagem: "img/copacabana.jpg", ondas: 0.3 },
            { nome: "Copacabana", local: "Posto 6", cidade: "Rio de Janeiro", estado: "RJ", bairro: "Copacabana", condicao: "Impropria", nota: 2.8, distancia: 1.3, andando: "6 min", lotacao: "10%", imagem: "img/copacabana.jpg", ondas: 1.7 },
            { nome: "Copacabana", local: "Posto 2", cidade: "Rio de Janeiro", estado: "RJ", bairro: "Copacabana", condicao: "Propria", nota: 6.7, distancia: 4.7, andando: "9 min", lotacao: "20%", imagem: "img/copacabana.jpg", ondas: 2.0 },
        ];

        const lista = document.getElementById("lista");
        const busca = document.getElementById("busca");
        const contador = document.getElementById("contador");

        const ICONE_CHECK = `<svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>`;
        const ICONE_CHECK_PEQUENO = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>`;
        const ICONE_X = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.6"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4" stroke-linecap="round"/></svg>`;
        const ICONE_ALERTA = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.6"/><path d="M8 4.8v4" stroke-linecap="round"/><circle cx="8" cy="11.2" r="0.6" fill="currentColor"/></svg>`;

        const condicoes = {
            Propria: { rotulo: "Própria", classe: "selo-propria", icone: ICONE_CHECK_PEQUENO },
            Impropria: { rotulo: "Imprópria", classe: "selo-impropria", icone: ICONE_X },
            Atencao: { rotulo: "Atenção", classe: "selo-atencao", icone: ICONE_ALERTA },
        };

        function render(items) {
            contador.textContent = `${items.length} postos encontrados • toque em ✓ para comparar (até 3)`;
            lista.innerHTML = items.map(p => {
                const condicao = condicoes[p.condicao];
                return `
            <article class="cartao-praia">
                <div class="cartao-info">
                    <p class="cartao-local">${p.local}</p>
                    <h2 class="cartao-nome">${p.nome}</h2>
                    <p class="cartao-detalhes">${p.bairro} • ${p.distancia} km • ~${p.andando} • lotação ${p.lotacao} • ondas ${p.ondas} m</p>
                    <span class="selo ${condicao.classe}">${condicao.icone}${condicao.rotulo}</span>
                </div>
                <button type="button" class="check-circulo" aria-label="Comparar">${ICONE_CHECK}</button>
            </article>`;
            }).join("");
        }

        busca.addEventListener("input", e => {
            const termo = e.target.value.toLowerCase();
            render(praias.filter(p =>
                p.nome.toLowerCase().includes(termo) ||
                p.local.toLowerCase().includes(termo) ||
                p.bairro.toLowerCase().includes(termo) ||
                p.cidade.toLowerCase().includes(termo)
            ));
        });

        render(praias);
    </script>
</body>

</html>
