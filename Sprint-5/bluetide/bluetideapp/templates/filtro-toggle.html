{% extends "base.html" %}

{% block title %}Filtros | BlueTide{% endblock %}

{% block content %}
<header class="page-heading">
    <div><p class="eyebrow">Explorar</p><h1>Filtros</h1><p>Os filtros reduzem a lista, mas nunca removem avisos de segurança ou de dados incompletos.</p></div>
</header>

<form method="get" action="{% url 'pesquisa' %}">
    <div class="grid-2">
        <fieldset class="card filter-group">
            <legend><h2>Qualidade da água</h2></legend>
            <label class="filter-option"><input type="checkbox" name="status" value="propria"><span><strong>Própria</strong><br><span class="small muted">Boletim recente dentro do limite.</span></span></label>
            <label class="filter-option"><input type="checkbox" name="status" value="atencao"><span><strong>Atenção</strong><br><span class="small muted">Há uma condição que pede cautela.</span></span></label>
            <label class="filter-option"><input type="checkbox" name="status" value="sem_dados"><span><strong>Sem recomendação</strong><br><span class="small muted">Mostra pontos ausentes, vencidos ou incompletos.</span></span></label>
        </fieldset>
        <fieldset class="card filter-group">
            <legend><h2>Perfil do dia</h2></legend>
            <label class="filter-option"><input type="radio" name="perfil" value="tranquilo" checked><span><strong>Banho tranquilo</strong><br><span class="small muted">Prefere ondas menores e vento leve.</span></span></label>
            <label class="filter-option"><input type="radio" name="perfil" value="surf"><span><strong>Surf iniciante</strong><br><span class="small muted">Procura ondas moderadas com vento controlado.</span></span></label>
            <label class="filter-option"><input type="radio" name="perfil" value="neutro"><span><strong>Sem preferência</strong><br><span class="small muted">Ordena somente por qualidade e atualidade.</span></span></label>
        </fieldset>
    </div>
    <div class="footer-actions"><a class="button-secondary" href="{% url 'pesquisa' %}">Limpar</a><button class="button" type="submit">Aplicar filtros</button></div>
</form>
{% endblock %}
