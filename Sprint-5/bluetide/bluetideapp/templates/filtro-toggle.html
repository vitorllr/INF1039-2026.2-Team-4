<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Filtros avançados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../static/css/filtro-toggle.css" rel="stylesheet">
</head>

<body class="bg-light">
    <main class="container py-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 fw-bold m-0">Filtros avançados</h1>
            <a href="pesquisa.html" class="btn-close" aria-label="Fechar"></a>
        </header>

        <section class="mb-4">
            <h2 class="small fw-semibold text-uppercase text-secondary mb-2">Balneabilidade</h2>
            <div class="d-flex flex-wrap gap-2">
                <input type="checkbox" class="btn-check" id="bal-propria" autocomplete="off">
                <label class="btn border-2 border-info-subtle rounded-pill px-3" for="bal-propria">Própria</label>

                <input type="checkbox" class="btn-check" id="bal-atencao" autocomplete="off">
                <label class="btn border-2 border-info-subtle rounded-pill px-3" for="bal-atencao">Atenção</label>

                <input type="checkbox" class="btn-check" id="bal-impropria" autocomplete="off">
                <label class="btn border-2 border-info-subtle rounded-pill px-3"
                    for="bal-impropria">Imprópria</label>

                <input type="checkbox" class="btn-check" id="bal-sem" autocomplete="off">
                <label class="btn border-2 border-info-subtle rounded-pill px-3" for="bal-sem">Sem dados</label>
            </div>
        </section>

        <section class="mb-4">
            <h2 class="small fw-semibold text-uppercase text-secondary mb-2">Região</h2>
            <div class="d-flex flex-wrap gap-2">
                <input type="checkbox" class="btn-check" id="reg-sul" autocomplete="off">
                <label class="btn border-2 border-info-subtle rounded-pill px-3" for="reg-sul">Zona Sul</label>

                <input type="checkbox" class="btn-check" id="reg-oeste" autocomplete="off">
                <label class="btn border-2 border-info-subtle rounded-pill px-3" for="reg-oeste">Zona Oeste</label>

                <input type="checkbox" class="btn-check" id="reg-centro" autocomplete="off">
                <label class="btn border-2 border-info-subtle rounded-pill px-3" for="reg-centro">Centro</label>

                <input type="checkbox" class="btn-check" id="reg-niteroi" autocomplete="off">
                <label class="btn border-2 border-info-subtle rounded-pill px-3" for="reg-niteroi">Niterói</label>
            </div>
        </section>

        <section class="mb-4">
            <label for="lotacao" class="form-label small fw-semibold text-uppercase text-secondary">Lotação máxima:
                <span id="lotacao-valor">100</span>%</label>
            <input type="range" class="form-range" id="lotacao" min="0" max="100" value="100">
        </section>

        <section class="mb-4">
            <label for="ondas" class="form-label small fw-semibold text-uppercase text-secondary">Ondas até: <span
                    id="ondas-valor">3,0</span> m</label>
            <input type="range" class="form-range" id="ondas" min="0" max="3" step="0.1" value="3">
        </section>

        <button class="btn btn-primary w-100 rounded-4 py-3 fs-5">Ver 20 resultados</button>
    </main>
</body>

</html>
