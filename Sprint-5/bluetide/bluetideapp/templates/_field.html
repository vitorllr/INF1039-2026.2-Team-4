<div class="field{% if field.errors %} has-error{% endif %}{% if extra_class %} {{ extra_class }}{% endif %}">
    <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}<p class="field-error" id="{{ field.auto_id }}_errors">{{ field.errors|join:" " }}</p>{% endif %}
</div>
